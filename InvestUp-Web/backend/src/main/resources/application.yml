server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: investup-api

  # ── Banco H2 em memória (zero configuração)
  datasource:
    url: jdbc:h2:mem:investupdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  # ── Console H2 (acessível em http://localhost:8080/h2-console)
  h2:
    console:
      enabled: true
      path: /h2-console

  # ── JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop        # recria tabelas ao iniciar (dev)
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# ── JWT
investup:
  jwt:
    secret: "InvestUpSuperSecretKeyForJWTSigning2026AcademicProject"
    expiration-ms: 86400000        # 24 horas em milissegundos

# ── CORS (permite o frontend React em dev)
  cors:
    allowed-origins:
      - "http://localhost:5173"    # Vite dev server
      - "http://localhost:3000"

# ── Logging
logging:
  level:
    com.investup: DEBUG
    org.springframework.security: INFO
